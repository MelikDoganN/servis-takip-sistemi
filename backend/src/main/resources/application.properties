# PostgreSQL — bağlantı bilgileri ortam değişkenlerinden okunur (Railway / local).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.security=INFO

# WhatsApp bot entegrasyonu (değerler ortam değişkenlerinden; secret yazmayın)
whatsapp.bot.url=${WHATSAPP_BOT_URL:}
whatsapp.bot.api-key=${WHATSAPP_BOT_API_KEY:}
whatsapp.bot.connect-timeout-ms=${WHATSAPP_CONNECT_TIMEOUT_MS:2000}
whatsapp.bot.read-timeout-ms=${WHATSAPP_READ_TIMEOUT_MS:3000}
whatsapp.outbox.poll-ms=${WHATSAPP_OUTBOX_POLL_MS:60000}
whatsapp.rate-limit.limit=${WHATSAPP_RATE_LIMIT:120}
whatsapp.rate-limit.window-ms=${WHATSAPP_RATE_LIMIT_WINDOW_MS:60000}
